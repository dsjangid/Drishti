<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DRISHTI — Initializing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Manrope:wght@700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle tactical grain & grid */
        .ambient-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Main Loader Unit */
        .loader-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Logo + Brand Name Row */
        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 16px;
            animation: fadeIn 0.6s ease-out forwards;
        }

        .brand-logo-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
        }

        .brand-logo-icon .material-symbols-outlined {
            font-size: 22px;
            color: #ffffff;
            font-variation-settings: "FILL" 0, "wght" 500;
        }

        .brand-title {
            font-family: "Manrope", sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.22em;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1;
            margin-right: -0.22em; /* offset trailing letter-spacing */
        }

        /* Middle Loading Line Component */
        .loading-track {
            position: relative;
            width: 280px;
            height: 2px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.5);
            animation: loadProgress 2.0s cubic-bezier(0.25, 1, 0.35, 1) forwards;
        }

        /* Minimal Telemetry / Status */
        .telemetry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 280px;
            font-family: "Share Tech Mono", monospace;
            font-size: 10px;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .telemetry-tag {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 50%;
            animation: pulseDot 1s infinite alternate;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            40% { width: 45%; }
            70% { width: 78%; }
            100% { width: 100%; }
        }

        @keyframes pulseDot {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* Exit Transition state */
        .is-leaving {
            opacity: 0 !important;
            transform: scale(0.97) !important;
        }
    </style>
</head>
<body>

    <div class="ambient-grid"></div>
    <div class="ambient-vignette"></div>

    <div class="loader-stage" id="loaderStage">
        <!-- Logo on Left + Name -->
        <div class="brand-cluster">
            <div class="brand-logo-icon">
                <span class="material-symbols-outlined">visibility</span>
            </div>
            <h1 class="brand-title">DRISHTI</h1>
        </div>

        <!-- Minimal Loading Line in Middle -->
        <div class="loading-track">
            <div class="loading-progress-bar"></div>
        </div>

        <!-- Telemetry Status Line -->
        <div class="telemetry-row">
            <span class="telemetry-tag">
                <i class="status-dot"></i>
                <span id="statusLabel">SYSTEM INIT</span>
            </span>
            <span id="percentLabel">0%</span>
        </div>
    </div>

    <script>
        // Precision 2.0-second counter & auto-redirect
        const percentLabel = document.getElementById("percentLabel");
        const statusLabel = document.getElementById("statusLabel");
        const loaderStage = document.getElementById("loaderStage");
        
        const duration = 2000; // 2 seconds
        const startTime = performance.now();

        function updateCounter(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1.0);
            
            // Eased counter
            const percent = Math.floor(progress * 100);
            percentLabel.textContent = `${percent}%`;

            if (percent > 65 && percent < 95) {
                statusLabel.textContent = "VERIFYING TELEMETRY";
            } else if (percent >= 95) {
                statusLabel.textContent = "SECURE PROTOCOL [OK]";
            }

            if (progress < 1.0) {
                requestAnimationFrame(updateCounter);
            } else {
                percentLabel.textContent = "100%";
                // Smooth exit fade after 2 seconds
                setTimeout(() => {
                    loaderStage.classList.add("is-leaving");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 350);
                }, 150);
            }
        }

        requestAnimationFrame(updateCounter);
    </script>
</body>
</html>
